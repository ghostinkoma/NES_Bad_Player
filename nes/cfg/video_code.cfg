# フェーズ2.x 動画プレイヤー: $F000-$FFFF の 4KB だけを出力する。
# make_video_rom.py がこれを全バンク（32KB）の後ろ 4KB にコピーして ROM を作る。
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, file = "";
    RAM:  start = $0200, size = $0600, type = rw, file = "";
    CODE: start = $F000, size = $1000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,   type = zp;
    BSS:       load = RAM,  type = bss, optional = yes;
    CODE:      load = CODE, type = ro;
    RODATA:    load = CODE, type = ro;
    BANKTABLE: load = CODE, type = ro, start = $FE00;
    VECTORS:   load = CODE, type = ro, start = $FFFA;
}
