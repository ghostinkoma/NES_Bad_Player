# =============================================================================
# unrom.cfg - ld65 リンカ設定（UNROM / mapper 2, PRG 32KB, CHR-RAM）
#
# MEMORY  : 「どのアドレスに、どれだけの領域があり、出力ファイルに含めるか」
# SEGMENTS: ソース中の .segment "名前" を、どの MEMORY に配置するか
#
# 出力ファイル(.nes)の並び = MEMORY の記述順で file = %O のもの
#   HDR(16) + PRG0(16KB) + PRG1(16KB) = 32784 バイト
# =============================================================================

MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, file = "";
    # $0300-$03FF はメールボックス(mailbox.inc)用に空けておく
    RAM:   start = $0400, size = $0400, type = rw, file = "";

    HDR:   start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;
    PRG0:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:  start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, define = yes, optional = yes;
    HEADER:   load = HDR,  type = ro;
    BANK0:    load = PRG0, type = ro, optional = yes;
    CODE:     load = PRG1, type = ro;
    RODATA:   load = PRG1, type = ro;
    VECTORS:  load = PRG1, type = ro, start = $FFFA;
}
