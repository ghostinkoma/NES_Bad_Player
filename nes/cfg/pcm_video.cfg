# PCM 版の動画プレイヤー: $F400-$FFFF の 3KB だけを出力する。
# make_pcm_rom.py がこれを全バンク（32KB）の後ろ 3KB にコピーして ROM を作る。
# RODATA はページの頭から始める（表を abs,X で読むときにページをまたいで 1 サイクル増えないように）
# RAM: $0100 レコード / $0200 OAM / $0300 先読みの音 / $0400-$06FF 無音 / $0700- その他
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, file = "";
    RAM:  start = $0700, size = $0100, type = rw, file = "";
    CODE: start = $F400, size = $0C00, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,   type = zp;
    BSS:       load = RAM,  type = bss, optional = yes;
    RODATA:    load = CODE, type = ro, start = $F400;
    CODE:      load = CODE, type = ro, start = $F500;
    BANKTABLE: load = CODE, type = ro, start = $FE00;
    CODE2:     load = CODE, type = ro, start = $FF00;
    VECTORS:   load = CODE, type = ro, start = $FFFA;
}
